<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THIENTRAN PATCHER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --primary: #00ffcc;
            --secondary: #ff0055;
            --bg-dark: rgba(10, 10, 12, 0.85);
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            /* CHÈN ẢNH GIF NỀN VÀO ĐÂY (Mày có thể thay link khác) */
            background-image: url('https://cdn.pixabay.com/animation/2023/05/03/03/01/03-01-40-404_512.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            letter-spacing: 3px;
        }

        .header p {
            color: #ccc;
            font-size: 12px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px black;
        }

        .panel {
            background: var(--bg-dark);
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.15);
            backdrop-filter: blur(10px);
        }

        .drop-zone {
            border: 2px dashed rgba(0, 255, 204, 0.6);
            border-radius: 8px;
            padding: 35px 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.4);
        }

        .drop-zone:hover { background: rgba(0, 255, 204, 0.1); }

        .drop-zone input { display: none; }

        .drop-text { font-size: 15px; }
        .drop-text span { color: var(--primary); font-weight: bold; }

        .file-info {
            display: none;
            font-size: 13px;
            color: var(--primary);
            text-align: center;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 15px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 12px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        .btn:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-pink {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .btn-pink:hover:not(:disabled) {
            background: rgba(255, 0, 85, 0.15);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        .btn-white:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .log-box {
            display: none;
            background: #000;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 15px;
            height: 100px;
            overflow-y: auto;
            font-size: 12px;
            margin-top: 15px;
            color: var(--primary);
        }

        .log-box p { margin-bottom: 4px; }
        .log-error { color: var(--secondary); }
        .log-success { color: #00ff00; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>THIENTRAN</h1>
            <p>[ INJECTOR FRAMEWORK ]</p>
        </div>

        <div class="panel">
            <div class="drop-zone" id="dropZone">
                <input type="file" id="fileInput">
                <div class="drop-text">Kéo thả file <span>assetindexer</span> gốc vào đây</div>
            </div>

            <div class="file-info" id="fileInfo">
                📁 FILE ĐÃ CHỌN: <span id="fileName"></span><br>
                ⚖️ SIZE: <span id="fileSize"></span>
            </div>

            <button class="btn btn-pink" id="btnPatchAim" disabled>[ PATCH AIM BỤNG ]</button>
            <button class="btn btn-white" id="btnDownload" disabled>[ TẢI XUỐNG FILE PATCH (~3D) ]</button>

            <div class="log-box" id="logBox"></div>
        </div>
    </div>
